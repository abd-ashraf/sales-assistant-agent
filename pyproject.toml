[project]
name = "sales-assistant"
version = "0.1.0"
description = "Command-line sales assistant agent: product answers from brochures, service cost estimates from past visits, flotation data checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",            # Langfuse connection errors in `check`
    "langchain-core==1.6.12",   # messages, tools and structured output
    "langchain-openai==1.7.2",  # the OpenAI chat model
    "langfuse==5.0.2",          # optional tracing of agent turns
    "langgraph==1.2.16",        # the agent graph
    "openai==3.33.0",           # API errors the chat reports
    "pydantic==2.14.1",         # tool arguments and product descriptions
    "pypdfium2==5.14.0",        # reads the brochure PDFs
    "python-dotenv==1.2.4",     # reads settings from .env
    "rich==15.0.0",             # terminal output
    "typer==0.27.3",            # command-line interface
]

[project.scripts]
sales-assistant = "sales_assistant.cli:run"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pylint==4.1.3",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100  # pylint's default, so both linters agree

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"  # test names already say what they check

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true  # pypdfium2 ships no type information mypy can use
